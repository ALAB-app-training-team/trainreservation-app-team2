# ワークフローの名前
name: Backend Auto Test

# ワークフローのトリガー設定
on:
  push:
    branches:
      - main
      - feature/* # featureで始まるすべてのブランチ
  # プルリクエスト時のトリガー設定
  pull_request:
    branches: [opened, reopened, synchronize, ready_for_review]

# 実行されるジョブの定義
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # ジョブの各ステップ
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test
