# ワークフローの名前
name: Build and Test

# ワークフローのトリガー設定
on:
  # プッシュ時のトリガー設定
  push:
    branches:
      - main
      - feature/* # featureで始まるすべてのブランチ
  # プルリクエスト時のトリガー設定
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# 実行されるジョブの定義
jobs:
  # Node.jsビルドとテストを行うジョブ
  node-build-and-test:
    # ジョブを実行する環境（Ubuntu最新版）
    runs-on: ubuntu-latest
    # ジョブの各ステップ
    steps:
      # リポジトリのコードをチェックアウト
      - uses: actions/checkout@v3

      # Node.jsのセットアップ
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22" # 使用するNode.jsのバージョン

      # npmの依存関係をインストール
      - name: Install Node.js dependencies
        run: npm install
        working-directory: ./frontend

      # ビルドプロセスの実行
      - name: Build
        run: npm run build
        working-directory: ./frontend

      # Lintテストを実行
      - name: Run Lint Check
        run: npm run lint
        working-directory: ./frontend

  # Backendの単体テストコード実行
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        working-directory: ./backend
        run: chmod +x gradlew

      - name: Run tests
        working-directory: ./backend
        run: ./gradlew clean test

      # テスト結果レポート出力
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
