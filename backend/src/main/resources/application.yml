spring:
  application:
    name: shinkansendego
  datasource:
    url: jdbc:postgresql://${DB_ENDPOINT}:5432/${DB_NAME}
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
server:
  servlet:
    session:
      timeout: 1m
      cookie:
        same-site: "none"
        secure: true
        http-only: true
