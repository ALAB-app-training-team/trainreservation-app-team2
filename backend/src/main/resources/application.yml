spring:
  application:
    name: shinkansendego
  datasource:
    url: jdbc:postgresql://${DB_ENDPOINT}:5432/${DB_NAME}
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
            required: ${MAIL_STARTTLS_REQUIRED:false}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: "none"
        secure: true
        http-only: true
app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
