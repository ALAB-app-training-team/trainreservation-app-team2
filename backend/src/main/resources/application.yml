spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://${DB_ENDPOINT}:5432/${DB_NAME}
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
