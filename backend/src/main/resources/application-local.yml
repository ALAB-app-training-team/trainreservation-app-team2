spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: appuser
    password: localpassword
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: false
    clean-on-validation-error: true
  jpa:
    show-sql: true
    hibernate: none
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
